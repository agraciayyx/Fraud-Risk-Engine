[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-risk-engine"
version = "0.1.0"
description = "Real-time fraud scoring service: allow, review or block each transfer, with reasons."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "scikit-learn>=1.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2>=2.16",  # FastAPI's TestClient
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pre-commit>=3.7",
]
notebook = [
    "jupyterlab>=4",
    "ipykernel>=6",
    "matplotlib>=3.8",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: errors, I: import order, B: bug-prone patterns, UP: modern syntax,
# SIM: simplifications, S: security checks (bandit).
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is how pytest works

[tool.mypy]
python_version = "3.11"
files = ["app", "tests"]
strict = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "lightgbm.*", "shap.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
